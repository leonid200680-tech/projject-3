<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Медданные</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
        nav a { margin-right: 15px; }
        .msg { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .file { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 4px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 8px; }
        th, td { border: 1px solid #ccc; padding: 4px 8px; font-size: 14px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Главная</a>
        <a href="{% url 'add' %}">Добавить запись</a>
        <a href="{% url 'upload' %}">Загрузить файл</a>
    </nav>
    <hr>
    {% if messages %}
        {% for m in messages %}
            <div class="msg {{ m.tags }}">{{ m }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
